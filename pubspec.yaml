name: clerkmate
description: "ClerkMate - School clerk automation app with AI form-fill and salary bill generator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # File paths (used by pdf/excel save)
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Networking (Gemini AI)
  http: ^1.2.2

  # File / image picking
  # Pinned to versions whose Android AAR metadata works with compileSdk 36
  # (newer builds demand SDK 37+, which the stable toolchain doesn't ship yet).
  file_picker: 8.1.2
  image_picker: 1.1.2

  # PDF generation + printing/preview
  pdf: ^3.11.1
  printing: ^5.13.2

  # Excel generation
  excel: ^4.0.6

  # Sharing files
  share_plus: ^10.0.2

  # Persist small key/values (language choice)
  shared_preferences: ^2.3.2

  # Supabase: cloud database + authentication (login)
  supabase_flutter: ^2.8.0

  intl: ^0.19.0

# Force stable plugin versions that build against compileSdk 36.
# The newest releases require an Android SDK that the stable toolchain
# doesn't ship yet, which breaks the CI APK build.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24
  image_picker_android: 0.8.12+18
  file_picker: 8.1.2
  path_provider_android: 2.2.15
  shared_preferences_android: 2.3.4
  url_launcher_android: 6.3.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSansDevanagari-Regular.ttf
