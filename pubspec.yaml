name: clerkmate
description: "ClerkMate - School clerk automation app with AI form-fill and salary bill generator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # File paths (used by pdf/excel save)
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Networking (Gemini AI)
  http: ^1.2.2

  # File / image picking
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # PDF generation + printing/preview
  pdf: ^3.11.1
  printing: ^5.13.2

  # Excel generation
  excel: ^4.0.6

  # Sharing files
  share_plus: ^10.0.2

  # Persist small key/values (language choice)
  shared_preferences: ^2.3.2

  # Supabase: cloud database + authentication (login)
  supabase_flutter: ^2.8.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSansDevanagari-Regular.ttf
